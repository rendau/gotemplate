syntax = "proto3";

package example_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "/example_v1";

service City {
  rpc List(CityListReq) returns (CityListRep) {
    option (google.api.http) = {
      get: "/city"
    };
  };
  rpc Get(CityGetReq) returns (CityMain) {
    option (google.api.http) = {
      get: "/city/{id}"
    };
  };
  rpc Create(CityCreateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/city"
      body: "*"
    };
  };
  rpc Update(CityUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/city/{id}"
      body: "*"
    };
  };
  rpc Delete(CityGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/city/{id}"
    };
  };
}

message CityMain {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp modified_at = 3;
  bool active = 4;
  string name = 5;
  string dsc = 6;
}

message CityGetReq {
  string id = 1;
}

message CityListReq {
  common.ListParamsSt list_params = 1;

  optional bool active = 2;
}

message CityListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated CityMain results = 2;
}

message CityCreateReq {
  optional bool active = 1;
  optional string name = 2;
  optional string dsc = 3;
}

message CityUpdateReq {
  string id = 1;
  optional bool active = 2;
  optional string name = 3;
  optional string dsc = 4;
}
