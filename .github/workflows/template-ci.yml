name: Template CI

on:
  push:
  pull_request:

jobs:
  render-and-build:
    name: Render template and build generated project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install cookiecutter
        run: pipx install cookiecutter

      - name: Render with defaults
        run: cookiecutter . --no-input -o /tmp/out install_skills=no

      - name: Skills are not installed when declined
        run: test ! -e ~/.claude/skills/crud

      - name: Render with custom values
        run: cookiecutter . --no-input -o /tmp/out-custom project_slug=orders module_owner=github.com/acme

      # у раннера нет SSH-доступа к <owner>/protos — остаются protos из шаблона
      - name: No protos repo without access
        run: |
          grep -qx 'PROTOS_REPO =' /tmp/out/myservice/Makefile
          grep -qx 'PROTOS_REPO =' /tmp/out-custom/orders/Makefile
          ! make -C /tmp/out/myservice refresh-vendor-proto

      # install_skills по умолчанию — да: hook клонирует go-service-skill и запускает install.sh
      - name: Skills are installed by default
        run: |
          for s in crud golang-service mobone golang-samber-lo; do
            test -f ~/.claude/skills/$s/SKILL.md
          done

      - name: Render with invalid project_slug must fail
        run: "! cookiecutter . --no-input -o /tmp/out-bad project_slug=Bad-Name install_skills=no"

      - name: Build generated project (defaults)
        working-directory: /tmp/out/myservice
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # локальный тулчейн из bin/ (Makefile вызывает только его); пробный .proto с HTTP/swagger-
      # аннотациями и общими типами — сгенерированный код должен собираться
      - name: Generate proto with the local toolchain
        working-directory: /tmp/out/myservice
        run: |
          cat > api/proto/myservice_v1/ping.proto <<'EOF'
          syntax = "proto3";
          package myservice_v1;
          option go_package = "/myservice_v1";
          import "google/api/annotations.proto";
          import "protoc-gen-openapiv2/options/annotations.proto";
          import "common/common.proto";
          option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {info: {title: "myservice"}};
          service Ping {
            rpc Ping(common.ListParamsSt) returns (common.ErrorRep) {
              option (google.api.http) = {get: "/ping"};
            }
          }
          EOF
          make generate-proto
          make proto-tools-version
          go build ./...
          git diff --exit-code -- pkg/proto/common

      - name: Assert no leftover template names
        working-directory: /tmp/out/myservice
        run: |
          ! grep -rnE '(mechta-market|rendau)/gotemplate' . --include='*.go' go.mod
          ! grep -rn 'mechta-market/mobone' . --include='*.go' go.mod go.sum
          # cookiecutter не рендерит файлы, которые считает двоичными (много кириллицы в
          # первом килобайте) — плейсхолдеры остаются как есть
          ! grep -rn 'cookiecutter\.' . --include='*.go' --include='*.mod' --include='*.yml' --include='*.yaml' --include='Makefile' --include='Dockerfile'
          test -d api/proto/myservice_v1
