name: Template CI

on:
  push:
  pull_request:

jobs:
  render-and-build:
    name: Render template and build generated project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install cookiecutter
        run: pipx install cookiecutter

      # команду и описание сервиса (манифест pulse) хук требует от человека — в CI задаём явно
      - name: Render with defaults
        run: cookiecutter . --no-input -o /tmp/out owner_team=platform service_description="Smoke-проверка шаблона" install_skills=no

      - name: Skills are not installed when declined
        run: test ! -e ~/.claude/skills/crud

      - name: Render with custom values
        run: cookiecutter . --no-input -o /tmp/out-custom project_slug=orders module_owner=github.com/acme owner_team=platform service_description="Заказы" criticality=high

      # install_skills по умолчанию — да: hook клонирует go-service-skill и запускает install.sh
      - name: Skills are installed by default
        run: |
          for s in crud golang-service mobone golang-samber-lo; do
            test -f ~/.claude/skills/$s/SKILL.md
          done

      - name: Render without service info must fail
        run: "! cookiecutter . --no-input -o /tmp/out-empty"

      - name: Build generated project (defaults)
        working-directory: /tmp/out/myservice
        run: |
          go build ./...
          go vet ./...
          go test ./internal/app/ ./internal/infra/pulsekit/...

      - name: Assert no leftover template names
        working-directory: /tmp/out/myservice
        run: |
          ! grep -rnE '(mechta-market|rendau)/gotemplate' . --include='*.go' go.mod
          ! grep -rn 'mechta-market/mobone' . --include='*.go' go.mod go.sum
          # cookiecutter не рендерит файлы, которые считает двоичными (много кириллицы в
          # первом килобайте) — плейсхолдеры остаются как есть
          ! grep -rn 'cookiecutter\.' . --include='*.go' --include='*.mod' --include='*.yml' --include='*.yaml' --include='Makefile' --include='Dockerfile'
          test -d api/proto/myservice_v1
