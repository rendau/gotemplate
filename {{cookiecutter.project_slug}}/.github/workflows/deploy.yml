name: Deploy
on:
  push:
    branches:
      - disabled
jobs:
  build:
    name: Build and deploy
    runs-on: yc-arc
    env:
      OWNER: {{ cookiecutter.__ci_owner }}
      IMAGE: {{ cookiecutter.project_slug }}:latest
    steps:
      - uses: actions/checkout@v6

      - run: go mod download

      # - run: go test -v ./...

      - run: make

      - run: echo {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %} | docker login ghcr.io -u $ --password-stdin

      - run: docker build -t ghcr.io/$OWNER/$IMAGE .

      - run: docker push ghcr.io/$OWNER/$IMAGE
